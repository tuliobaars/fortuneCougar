# Publish fortuneCougar on GitHub Pages (free): the app is exported with
# Shinylive and runs entirely in the visitor's browser on webR.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: System libraries for shinylive (archive, curl)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-dev libcurl4-openssl-dev libssl-dev

      - name: Install shinylive
        run: Rscript --no-init-file -e 'install.packages(c("shinylive", "shiny", "bslib"), repos = "https://cloud.r-project.org")'

      - name: Build the static site
        # --no-init-file: skip the renv .Rprofile, the export only needs shinylive
        run: Rscript --no-init-file tools/build_site.R _site

      # the same site as a plain zip, for Netlify Drop / Cloudflare Pages / Vercel (see DEPLOY.md)
      - uses: actions/upload-artifact@v4
        with:
          name: fortuneCougar-site
          path: _site
          include-hidden-files: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
